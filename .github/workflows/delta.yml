name: Delta

on:
  workflow_dispatch:
    inputs:
      base: { default: 'v1' }   # Base image tag already on robot
      target: { default: 'v2' } # New image tag to update to

jobs:
  delta:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Build & Upload Delta
        run: |
          # 1. Install and start balena-engine daemon (arm64)
          curl -sL https://github.com/balena-os/balena-engine/releases/download/v20.10.43/balena-engine-v20.10.43-arm64.tar.gz | sudo tar -xz -C /usr/local/bin
          sudo balena-engine-daemon & sleep 3

          # 2. Login to GitHub Container Registry directly via balena-engine
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo balena-engine login ghcr.io -u ${{ github.actor }} --password-stdin

          # 3. Pull source images, compute binary delta, and push to registry
          REPO="ghcr.io/${{ github.repository }}"
          sudo balena-engine pull "$REPO:${{ inputs.base }}"
          sudo balena-engine pull "$REPO:${{ inputs.target }}"
          sudo balena-engine image delta -t "$REPO:delta-${{ inputs.base }}-to-${{ inputs.target }}" "$REPO:${{ inputs.base }}" "$REPO:${{ inputs.target }}"
          sudo balena-engine push "$REPO:delta-${{ inputs.base }}-to-${{ inputs.target }}"

          # 4. Export delta tarball for downloadable workflow artifact
          sudo balena-engine save "$REPO:delta-${{ inputs.base }}-to-${{ inputs.target }}" -o delta.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: delta-${{ inputs.base }}-to-${{ inputs.target }}
          path: delta.tar
